name: React build
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build frontend
        run: npm run build
      - name: Check VPS deployment script syntax
        run: bash -n deploy/repair-live.sh deploy/connect-domain-ssl.sh deploy/diagnose.sh deploy/update-approved-ui.sh
