name: Nexora Solidity contract CI

on:
  push:
    branches:
      - feature/nexora-profit-vault-v1
    paths:
      - 'smart-contracts/**'
      - '.github/workflows/contract-tests.yml'
  pull_request:
    paths:
      - 'smart-contracts/**'
      - '.github/workflows/contract-tests.yml'
  workflow_dispatch:

jobs:
  solidity:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: smart-contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned OpenZeppelin package
        run: npm install --no-audit --no-fund
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Compile Solidity
        run: forge build --sizes
      - name: Test accounting and referral rules
        run: forge test -vv
