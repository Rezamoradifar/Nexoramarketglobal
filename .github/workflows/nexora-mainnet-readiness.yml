name: Nexora Mainnet Readiness CI

on:
  push:
    branches:
      - feature/nexora-mainnet-preflight-20261113
      - feature/nexora-90day-withdrawal-policy-review
      - feature/nexora-v2-security-markets-20261113
      - feature/nexora-fully-backed-gross-credit-20261113
      - feature/nexora-transparent-gross-net-ui-20261113
      - feature/nexora-beneficiary-wallets-20261114
      - feature/nexora-mainnet-security-gate-20261114
    paths:
      - 'smart-contracts/**'
      - '.github/workflows/nexora-mainnet-readiness.yml'
  pull_request:
    paths:
      - 'smart-contracts/**'
      - '.github/workflows/nexora-mainnet-readiness.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    name: Build and test Nexora preflight
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: smart-contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Install pinned OpenZeppelin
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Build Solidity
        run: forge build --sizes
      - name: Validate beneficiary wallet registry (no RPC)
        run: python3 scripts/check-beneficiary-config.py
      - name: Run full Foundry suite with extended fuzzing (1024 cases per fuzz test)
        run: forge test -vv --fuzz-runs 1024
      - name: Validate read-only preflight syntax
        run: bash -n preflight-mainnet.sh postdeploy-readonly.sh
      - name: List blockers to mainnet (never broadcasts)
        run: python3 scripts/check-mainnet-blockers.py
